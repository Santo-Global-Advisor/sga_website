en:
  - n: "01"
    title: "Engagement & consultation"
    items:
      - q: "Do you work with clients outside Brazil?"
        a: "Yes. We provide remote consultations and full support for clients planning their move from abroad. Most of our work with new clients begins well before they set foot in Brazil."
      - q: "Is the first consultation paid?"
        a: "Yes. The first consultation is a paid strategic review of your case, risks and next steps. When appropriate, this is followed by a clear roadmap for the legal and practical work ahead."
      - q: "In which languages can we work?"
        a: "Consultations and correspondence are available in English, French and Portuguese."
      - q: "How quickly will I receive a response?"
        a: "We respond to every serious enquiry within one business day to confirm scheduling and share the consultation fee and booking link."
  - n: "02"
    title: "Scope of work"
    items:
      - q: "Do you only help with visas?"
        a: "No. Visas are one component. We also assist with CPF and legal registration, banking setup, tax structuring, real estate decisions, and practical relocation coordination — coordinated as a single strategy rather than isolated pieces."
      - q: "Do you work with families?"
        a: "Yes. Family reunification, dependent visas, schooling coordination, housing and legal setup for all members — handled as one plan."
      - q: "Can you assist once I am already in Brazil?"
        a: "Yes. Many clients come to us after arrival to regularise status, restructure taxation, or address issues that arose from handling things alone."
  - n: "03"
    title: "Outcomes & expectations"
    items:
      - q: "Do you guarantee visa approval or investment results?"
        a: "No. We provide legal guidance, strategy and process support, but final outcomes depend on the authorities, documentation and facts of each case. What we do guarantee is clarity on what the process requires and how we will navigate it together."
      - q: "How long does the full process take?"
        a: "It depends on the pathway, the documentation you have, and the jurisdictions involved. Timelines are established in the first consultation and updated as the case progresses."
  - n: "04"
    title: "Confidentiality"
    items:
      - q: "Is my information treated confidentially?"
        a: "Yes. Every consultation is handled with full professional confidentiality, consistent with the obligations of a licensed Brazilian lawyer."
      - q: "How is client data stored?"
        a: "Case files and correspondence are held under professional secrecy and stored according to OAB requirements. We do not share client information with third parties without explicit written consent."
fr:
  - n: "01"
    title: "Mandat et consultation"
    items:
      - q: "Travaillez-vous avec des clients hors du Brésil ?"
        a: "Oui. Nous assurons des consultations à distance et un accompagnement complet pour les clients qui préparent leur installation depuis l'étranger. La plupart des nouveaux dossiers commencent bien avant l'arrivée au Brésil."
      - q: "La première consultation est-elle payante ?"
        a: "Oui. La première consultation est une revue stratégique payante de votre dossier, de ses risques et des prochaines étapes. Lorsqu'elle est pertinente, elle est suivie d'une feuille de route claire pour le travail juridique et pratique à venir."
      - q: "Dans quelles langues pouvons-nous travailler ?"
        a: "Les consultations et les échanges sont disponibles en anglais, en français et en portugais."
      - q: "Sous quel délai recevrai-je une réponse ?"
        a: "Nous répondons à toute demande sérieuse sous un jour ouvré afin de confirmer la planification et de communiquer les honoraires et le lien de réservation."
  - n: "02"
    title: "Périmètre d'intervention"
    items:
      - q: "Vous occupez-vous uniquement des visas ?"
        a: "Non. Le visa n'est qu'un élément. Nous intervenons aussi sur le CPF et les enregistrements juridiques, la banque, la structuration fiscale, l'immobilier et la coordination pratique de l'installation — dans une stratégie unique et cohérente."
      - q: "Travaillez-vous avec les familles ?"
        a: "Oui. Réunification familiale, visas dépendants, coordination scolaire, logement et organisation juridique pour tous les membres — gérés comme un seul plan."
      - q: "Pouvez-vous intervenir si je suis déjà au Brésil ?"
        a: "Oui. De nombreux clients nous consultent après leur arrivée pour régulariser leur statut, restructurer leur fiscalité ou résoudre des difficultés nées d'une gestion isolée."
  - n: "03"
    title: "Résultats et attentes"
    items:
      - q: "Garantissez-vous l'obtention d'un visa ou la réussite d'un investissement ?"
        a: "Non. Nous apportons conseil juridique, stratégie et accompagnement de procédure, mais l'issue finale dépend des autorités, des documents et des faits propres à chaque dossier. Ce que nous garantissons, c'est la clarté sur les exigences du processus et la manière de le conduire."
      - q: "Combien de temps dure l'ensemble du processus ?"
        a: "Cela dépend de la voie choisie, de la documentation dont vous disposez et des juridictions concernées. Les délais sont fixés lors de la première consultation et ajustés à mesure que le dossier progresse."
  - n: "04"
    title: "Confidentialité"
    items:
      - q: "Mes informations sont-elles traitées confidentiellement ?"
        a: "Oui. Chaque consultation est traitée avec une confidentialité professionnelle complète, conforme aux obligations d'un avocat brésilien agréé."
      - q: "Comment les données clients sont-elles conservées ?"
        a: "Les dossiers et échanges sont conservés sous secret professionnel et stockés conformément aux exigences de l'OAB. Nous ne partageons aucune information client avec des tiers sans consentement écrit explicite."
pt:
  - n: "01"
    title: "Atuação e consulta"
    items:
      - q: "Vocês atendem clientes fora do Brasil?"
        a: "Sim. Fazemos consultas remotas e oferecemos suporte completo para clientes que planejam a mudança do exterior. A maior parte dos novos casos começa bem antes da chegada ao Brasil."
      - q: "A primeira consulta é paga?"
        a: "Sim. A primeira consulta é uma revisão estratégica paga do seu caso, dos riscos e dos próximos passos. Quando fizer sentido, ela é seguida por um roteiro claro para o trabalho jurídico e prático seguinte."
      - q: "Em quais idiomas podemos trabalhar?"
        a: "Consultas e comunicações estão disponíveis em inglês, francês e português."
      - q: "Em quanto tempo receberei uma resposta?"
        a: "Respondemos toda consulta séria em até um dia útil para confirmar o agendamento e informar os honorários e o link de reserva."
  - n: "02"
    title: "Escopo de trabalho"
    items:
      - q: "Vocês cuidam apenas de vistos?"
        a: "Não. O visto é apenas uma parte. Também auxiliamos com CPF e registros legais, abertura de conta, estruturação tributária, decisões imobiliárias e coordenação prática da mudança — tudo como uma estratégia única."
      - q: "Vocês trabalham com famílias?"
        a: "Sim. Reunião familiar, vistos para dependentes, coordenação escolar, moradia e estrutura jurídica para todos os membros — tratados como um único plano."
      - q: "Vocês podem ajudar se eu já estiver no Brasil?"
        a: "Sim. Muitos clientes nos procuram depois da chegada para regularizar status, reestruturar tributação ou resolver questões surgidas ao tentar cuidar de tudo sozinhos."
  - n: "03"
    title: "Resultados e expectativas"
    items:
      - q: "Vocês garantem aprovação de visto ou resultado de investimento?"
        a: "Não. Fornecemos orientação jurídica, estratégia e suporte de processo, mas o resultado final depende das autoridades, da documentação e dos fatos de cada caso. O que garantimos é clareza sobre o que o processo exige e como iremos conduzi-lo."
      - q: "Quanto tempo leva o processo completo?"
        a: "Depende do caminho escolhido, da documentação disponível e das jurisdições envolvidas. Os prazos são definidos na primeira consulta e atualizados conforme o caso avança."
  - n: "04"
    title: "Confidencialidade"
    items:
      - q: "Minhas informações são tratadas com confidencialidade?"
        a: "Sim. Toda consulta é conduzida com plena confidencialidade profissional, em linha com as obrigações de um advogado brasileiro inscrito."
      - q: "Como os dados dos clientes são armazenados?"
        a: "Arquivos e comunicações são mantidos sob sigilo profissional e armazenados de acordo com as exigências da OAB. Não compartilhamos informações de clientes com terceiros sem consentimento escrito e expresso."
