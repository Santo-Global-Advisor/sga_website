en:
  - id: "retirees"
    label: "Retirees"
    title: "A retirement rooted in the right legal framework."
    desc: "The retirement visa is a clear path — but tax residency, pension treatment and property ownership rarely are. We coordinate the full picture so your move is built to last."
    bullets:
      - "Retirement visa (VITEM XIV) eligibility review"
      - "Pension and foreign-income tax treatment"
      - "Property purchase and long-term housing"
      - "Healthcare registration and local setup"
  - id: "nomads"
    label: "Digital nomads"
    title: "Work remotely in Brazil, structured properly."
    desc: "Brazil's digital nomad visa is accessible, but stays longer than a year quickly trigger tax residency. We make sure the structure is clear before you land."
    bullets:
      - "Digital nomad visa application and renewals"
      - "Tax residency thresholds and contract structuring"
      - "CPF, banking and payment platform setup"
      - "Short and mid-term housing assistance"
  - id: "investors"
    label: "Investors"
    title: "Enter the Brazilian market without structural risk."
    desc: "Real estate and capital investment in Brazil require legal and tax structure before committing. We review, advise and execute — quietly."
    bullets:
      - "Investor visa (VIPER / VITEM XIII) pathways"
      - "Holding and entity structuring in Brazil"
      - "Real estate due diligence and acquisition"
      - "Ongoing tax compliance and reporting"
  - id: "families"
    label: "Families"
    title: "A coordinated move for the whole household."
    desc: "Family reunification, schools, housing and legal setup for spouses and children — handled as one plan rather than five."
    bullets:
      - "Family reunification and dependent visas"
      - "Schooling and enrollment coordination"
      - "Family housing, rental or purchase"
      - "CPF and legal registration for all members"
  - id: "professionals"
    label: "Professionals"
    title: "Relocate for work without losing momentum."
    desc: "For executives and professionals taking a role in Brazil — or continuing a cross-border role from here. We handle the legal bridge."
    bullets:
      - "Work and professional visa applications"
      - "Employment contract and tax review"
      - "Corporate registration when relevant"
      - "Relocation logistics and onboarding"
fr:
  - id: "retirees"
    label: "Retraités"
    title: "Une retraite fondée sur le bon cadre juridique."
    desc: "Le visa retraite est une voie claire — mais la résidence fiscale, le traitement des pensions et la détention immobilière le sont rarement. Nous coordonnons l'ensemble pour que votre installation tienne dans le temps."
    bullets:
      - "Analyse d'éligibilité au visa retraite (VITEM XIV)"
      - "Traitement fiscal des pensions et revenus étrangers"
      - "Achat immobilier et logement de long terme"
      - "Affiliation santé et installation locale"
  - id: "nomads"
    label: "Nomades digitaux"
    title: "Travailler à distance au Brésil, avec une structure solide."
    desc: "Le visa de nomade digital brésilien est accessible, mais un séjour de plus d'un an déclenche rapidement la résidence fiscale. Nous clarifions la structure avant votre arrivée."
    bullets:
      - "Demande et renouvellement du visa nomade digital"
      - "Seuils de résidence fiscale et structuration des contrats"
      - "CPF, banque et mise en place des flux de paiement"
      - "Recherche de logement court et moyen séjour"
  - id: "investors"
    label: "Investisseurs"
    title: "Entrer sur le marché brésilien sans risque structurel."
    desc: "L'immobilier et l'investissement au Brésil exigent une structure juridique et fiscale avant tout engagement. Nous analysons, conseillons et exécutons — discrètement."
    bullets:
      - "Voies de visa investisseur (VIPER / VITEM XIII)"
      - "Structuration par holding ou société au Brésil"
      - "Due diligence immobilière et acquisition"
      - "Conformité fiscale continue et reporting"
  - id: "families"
    label: "Familles"
    title: "Une installation coordonnée pour tout le foyer."
    desc: "Réunification familiale, écoles, logement et organisation juridique pour le conjoint et les enfants — gérés comme un seul plan, pas comme cinq dossiers séparés."
    bullets:
      - "Réunification familiale et visas dépendants"
      - "Coordination scolaire et inscriptions"
      - "Logement familial, location ou achat"
      - "CPF et enregistrements juridiques pour chaque membre"
  - id: "professionals"
    label: "Professionnels"
    title: "S'installer pour le travail sans perdre d'élan."
    desc: "Pour les dirigeants et professionnels qui prennent un poste au Brésil — ou poursuivent ici un rôle transfrontalier. Nous construisons le pont juridique."
    bullets:
      - "Demandes de visa de travail et professionnel"
      - "Analyse du contrat de travail et de la fiscalité"
      - "Enregistrements d'entreprise si nécessaire"
      - "Logistique d'installation et prise de poste"
pt:
  - id: "retirees"
    label: "Aposentados"
    title: "Uma aposentadoria apoiada no enquadramento jurídico correto."
    desc: "O visto de aposentadoria é um caminho claro — mas residência fiscal, tratamento da pensão e titularidade de imóveis raramente são. Coordenamos o quadro completo para que sua mudança seja sustentável."
    bullets:
      - "Análise de elegibilidade para visto de aposentadoria (VITEM XIV)"
      - "Tratamento tributário de pensão e renda no exterior"
      - "Compra de imóvel e moradia de longo prazo"
      - "Registro em saúde e estruturação local"
  - id: "nomads"
    label: "Nômades digitais"
    title: "Trabalhe remotamente no Brasil com a estrutura certa."
    desc: "O visto de nômade digital no Brasil é acessível, mas permanências acima de um ano rapidamente geram residência fiscal. Garantimos clareza na estrutura antes da sua chegada."
    bullets:
      - "Pedido e renovação do visto de nômade digital"
      - "Limites de residência fiscal e estruturação contratual"
      - "CPF, banco e configuração de plataformas de pagamento"
      - "Apoio com moradia de curto e médio prazo"
  - id: "investors"
    label: "Investidores"
    title: "Entre no mercado brasileiro sem risco estrutural."
    desc: "Investimento imobiliário e de capital no Brasil exigem estrutura jurídica e tributária antes de qualquer compromisso. Revisamos, orientamos e executamos — com discrição."
    bullets:
      - "Caminhos para visto de investidor (VIPER / VITEM XIII)"
      - "Estruturação com holding ou empresa no Brasil"
      - "Due diligence imobiliária e aquisição"
      - "Conformidade tributária contínua e reporte"
  - id: "families"
    label: "Famílias"
    title: "Uma mudança coordenada para todo o núcleo familiar."
    desc: "Reunião familiar, escolas, moradia e estrutura jurídica para cônjuge e filhos — tratados como um único plano, e não como cinco frentes separadas."
    bullets:
      - "Reunião familiar e vistos para dependentes"
      - "Coordenação escolar e matrículas"
      - "Moradia familiar, locação ou compra"
      - "CPF e registros jurídicos para todos os membros"
  - id: "professionals"
    label: "Profissionais"
    title: "Mude-se por trabalho sem perder ritmo."
    desc: "Para executivos e profissionais que assumem uma posição no Brasil — ou seguem daqui em uma função internacional. Nós cuidamos da ponte jurídica."
    bullets:
      - "Pedidos de visto de trabalho e profissional"
      - "Revisão de contrato de trabalho e impactos tributários"
      - "Registros societários quando necessários"
      - "Logística de mudança e integração inicial"
