en:
  - q: "Do you work with clients outside Brazil?"
    a: "Yes. We provide remote consultations and full support for clients planning their move from abroad. Most of our work with new clients begins before they set foot in Brazil."
  - q: "Do you only help with visas?"
    a: "No. Visas are one component. We also assist with CPF and legal registration, banking setup, tax structuring, real estate decisions, and practical relocation coordination — as a single coordinated strategy rather than isolated pieces."
  - q: "Is the first consultation paid?"
    a: "Yes. The first consultation is a paid strategic review of your case, risks and next steps. When appropriate, this is followed by a clear roadmap for the legal and practical work ahead."
  - q: "Do you guarantee visa approval or investment results?"
    a: "No. We provide legal guidance, strategy and process support, but final outcomes depend on the authorities, documentation and facts of each case. What we do guarantee is clarity on what the process requires and how we will navigate it together."
  - q: "Is my information treated confidentially?"
    a: "Yes. Every consultation is handled with full professional confidentiality, consistent with the obligations of a licensed Brazilian lawyer."
  - q: "In which languages can we work?"
    a: "Consultations and correspondence are available in English, French and Portuguese."
fr:
  - q: "Travaillez-vous avec des clients hors du Brésil ?"
    a: "Oui. Nous assurons des consultations à distance et un accompagnement complet pour les clients qui préparent leur installation depuis l'étranger. La plupart des dossiers commencent avant même l'arrivée au Brésil."
  - q: "Vous occupez-vous uniquement des visas ?"
    a: "Non. Le visa n'est qu'un élément. Nous intervenons aussi sur le CPF et les enregistrements juridiques, la banque, la structuration fiscale, l'immobilier et la coordination pratique de l'installation — dans une stratégie unique."
  - q: "La première consultation est-elle payante ?"
    a: "Oui. La première consultation est une revue stratégique payante de votre dossier, de ses risques et des prochaines étapes. Lorsqu'elle est pertinente, elle est suivie d'une feuille de route claire pour le travail juridique et pratique à venir."
  - q: "Garantissez-vous l'obtention d'un visa ou la réussite d'un investissement ?"
    a: "Non. Nous apportons conseil juridique, stratégie et accompagnement de procédure, mais l'issue finale dépend des autorités, des documents et des faits propres à chaque dossier. Ce que nous garantissons, c'est la clarté sur les exigences du processus et la manière de le conduire."
  - q: "Mes informations sont-elles traitées confidentiellement ?"
    a: "Oui. Chaque consultation est traitée avec une confidentialité professionnelle complète, conforme aux obligations d'un avocat brésilien agréé."
  - q: "Dans quelles langues pouvons-nous travailler ?"
    a: "Les consultations et les échanges sont disponibles en anglais, en français et en portugais."
pt:
  - q: "Vocês atendem clientes fora do Brasil?"
    a: "Sim. Fazemos consultas remotas e oferecemos suporte completo para clientes que planejam a mudança do exterior. A maior parte do nosso trabalho com novos clientes começa antes mesmo de eles chegarem ao Brasil."
  - q: "Vocês cuidam apenas de vistos?"
    a: "Não. O visto é apenas uma parte. Também auxiliamos com CPF e registros legais, abertura de conta, estruturação tributária, decisões imobiliárias e coordenação prática da mudança — como uma estratégia única e coordenada."
  - q: "A primeira consulta é paga?"
    a: "Sim. A primeira consulta é uma revisão estratégica paga do seu caso, dos riscos e dos próximos passos. Quando fizer sentido, ela é seguida por um roteiro claro para o trabalho jurídico e prático seguinte."
  - q: "Vocês garantem aprovação de visto ou resultado de investimento?"
    a: "Não. Fornecemos orientação jurídica, estratégia e suporte de processo, mas o resultado final depende das autoridades, da documentação e dos fatos de cada caso. O que garantimos é clareza sobre o que o processo exige e como iremos conduzi-lo com você."
  - q: "Minhas informações são tratadas com confidencialidade?"
    a: "Sim. Toda consulta é conduzida com plena confidencialidade profissional, em linha com as obrigações de um advogado brasileiro inscrito."
  - q: "Em quais idiomas podemos trabalhar?"
    a: "Consultas e comunicações estão disponíveis em inglês, francês e português."
