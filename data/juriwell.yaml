# Juriwell integration for the guide lead-magnet CTA.
#
# `enabled` switches the CTA at the bottom of every guide. While false, guides
# show a standalone consultation + WhatsApp block and none of the settings
# below are used. Flip to true only once the Juriwell backend is live:
#   - leads route to SGA's firm (not the "default" tenant), CORS allows this
#     domain, and POST /leads is rate-limited          (Track A)
#   - the welcome_url page exists                       (Track C1)
#   - the guide email is delivered, or the copy below no longer promises it
#   - the hook copy no longer promises AI answers unless they are built
# See GUIDES-AND-JURIWELL.md.
enabled: false

# `endpoint` receives the email capture (POST JSON: email, name, service,
# message, source). Leave empty to disable the network call — the CTA then
# still opens the Juriwell welcome page, so the flow never dead-ends.
#
# `welcome_url` is Jonathan's branded Juriwell office page. The CTA appends
# ?topic=<guide topic key>&lang=<page language>&ref=<referral tag>.
endpoint: ""
welcome_url: "https://juriwell.com/welcome/santo-global-advisory"
referral: "sga"
source_prefix: "sga-guide"
service: "immigration"

en:
  eyebrow: "Free guide"
  title: "Get <em>Move to Brazil</em> — the full 32-chapter guide."
  body: "Written by Jonathan Stephan, Brazilian licensed lawyer (OAB/SP 379172). Immigration pathways, tax residency, property, banking and the first 30 days — checked against gov.br sources for the 2026 edition."
  hook: "You will also get access to my Juriwell office, where I stay in touch with clients, answer questions on this topic quickly, and use AI to give you a first read on your situation before we ever schedule a call."
  placeholder: "your@email.com"
  submit: "Send me the guide"
  note: "One email with the guide. No newsletter spam. Unsubscribe any time."
  loading: "Sending…"
  success: "Check your inbox — opening Jonathan's Juriwell office now."
  error: "That did not go through. Email jonathanstephan23@gmail.com and we will send it directly."
  invalid: "Please enter a valid email address."

